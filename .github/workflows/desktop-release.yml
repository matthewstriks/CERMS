name: Desktop installers and releases

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/release-check.mjs

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: --win nsis --x64
          - os: macos-latest
            platform: macos
            args: --mac --universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify release inputs and package installers
        shell: bash
        env:
          CERMS_RELEASE_REPOSITORY: ${{ github.repository }}
          # Windows manual builds are update-capable; unsigned Mac previews are not.
          CERMS_RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || (matrix.platform == 'windows' && '1' || '0') }}
          CERMS_RELEASE_PLATFORM: ${{ matrix.platform }}
          # Signing is optional for now. Unsigned Mac downloads use manual updates.
          CERMS_MAC_SIGNED_RELEASE: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && '1' || '0' }}
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          node scripts/release-check.mjs
          npx electron-builder --config electron-builder.config.cjs ${{ matrix.args }} --publish never
      - name: Keep installers and update metadata
        uses: actions/upload-artifact@v6
        with:
          name: cerms-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/alpha*.yml
            release/beta*.yml
            release/rc*.yml

  # Firebase Windows alpha releases are published deliberately from the developer
  # machine with npm run release:alpha. CI remains build-only; no cloud keys here.
